<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100svh;display:flex;align-items:center;justify-content:center;
  background:#141414;color:rgba(255,255,255,.78);text-align:center;
  font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.55;
  padding:40px 22px;-webkit-font-smoothing:antialiased;
}
body::after{
  content:"";position:fixed;left:-10%;right:-10%;bottom:-6%;height:40%;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,rgba(255,101,55,.4),rgba(200,40,30,.15) 42%,transparent 72%);
}
main{max-width:420px}
img{width:200px;height:auto;display:block;margin:0 auto 28px}
h1{font-family:'Oswald',sans-serif;font-weight:600;color:#fff;font-size:clamp(28px,8vw,38px);line-height:1.1;text-transform:uppercase;margin-bottom:12px}
p{margin-bottom:28px}
.btns{display:flex;flex-direction:column;gap:12px}
a{
  display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:9999px;
  font-family:'Oswald',sans-serif;font-weight:500;font-size:17px;letter-spacing:.04em;text-transform:uppercase;
  text-decoration:none;color:#fff;border:1.5px solid rgba(255,255,255,.35);
  transition:transform 160ms cubic-bezier(0.23,1,0.32,1);
}
a:active{transform:scale(.97)}
a:first-child{background:#FF6537;border-color:#FF6537;color:#141414}
</style>
</head>
<body>
<main>
  <img src="https://res.cloudinary.com/eekglpse/image/upload/w_400,q_auto,f_auto/v1792543356/logo-negativo-margen.png" alt="Espacio Ceniza">
